<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Uber 링크 시험</title>
<style>body{font-family:system-ui,sans-serif;background:#f3ede1;color:#2b2a26;margin:0;padding:20px 16px 40px;line-height:1.5}
h1{font-size:20px;margin:0 0 6px}p{margin:0 0 18px;color:#6b6457;font-size:14px}
a{display:block;background:#1d3b2c;color:#fff;text-decoration:none;border-radius:12px;padding:14px 16px;margin:0 0 12px;font-size:16px}
a small{display:block;color:#cfe0d4;font-size:12px;margin-top:2px}</style></head>
<body><h1>우버 출발지 시험 (임시 페이지)</h1>
<p>버튼을 하나씩 눌러보고, 우버에 출발지가 어디로 뜨는지 알려주세요. 한 번 누른 뒤에는 우버를 완전히 닫고 다음 버튼을 눌러주세요.</p>
<script>
var LAT=37.493688,LNG=126.996188,EN="97 Bangbae-ro 34-gil, Seocho-gu, Seoul";
var v=[
 ["A","좌표만 (괄호 그대로)","https://m.uber.com/ul/?action=setPickup&pickup[latitude]="+LAT+"&pickup[longitude]="+LNG+"&pickup[nickname]=Gangnam%20Calme"],
 ["B","좌표 + 영문 주소","https://m.uber.com/ul/?action=setPickup&pickup[latitude]="+LAT+"&pickup[longitude]="+LNG+"&pickup[nickname]=Gangnam%20Calme&pickup[formatted_address]="+encodeURIComponent(EN)],
 ["C","우버 앱 바로 열기 (uber://)","uber://?action=setPickup&pickup[latitude]="+LAT+"&pickup[longitude]="+LNG+"&pickup[nickname]=Gangnam%20Calme"],
 ["D","새 우버 웹 형식","https://m.uber.com/looking?pickup="+encodeURIComponent(JSON.stringify({latitude:LAT,longitude:LNG,addressLine1:"Gangnam Calme",addressLine2:EN}))],
 ["E","지금 앱에 있는 방식","https://m.uber.com/ul/?action=setPickup&pickup%5Blatitude%5D="+LAT+"&pickup%5Blongitude%5D="+LNG+"&pickup%5Bnickname%5D="+encodeURIComponent("Gangnam Calme (서울 서초구 방배로34길 97)")]
];
v.forEach(function(x){document.write('<a href="'+x[2].replace(/"/g,"&quot;")+'">'+x[0]+'. '+x[1]+'<small>'+x[0]+' 버튼</small></a>')});
</script></body></html>

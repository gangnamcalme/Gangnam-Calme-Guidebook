/* ---------- 언어 ---------- */
const LANG_KEY = "guestapp-lang";
function detectLang() {
  try {
    const saved = localStorage.getItem(LANG_KEY);
    if (saved === "kr" || saved === "en") return saved;
  } catch (e) {}
  const nav = (navigator.language || (navigator.languages && navigator.languages[0]) || "").toLowerCase();
  return nav.indexOf("ko") === 0 ? "kr" : "en";
}
let LANG = detectLang();
document.documentElement.setAttribute("data-lang", LANG);
document.documentElement.setAttribute("lang", LANG === "kr" ? "ko" : "en");

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function isPair(v) {
  return v && typeof v === "object" && ("kr" in v || "en" in v);
}
/* 화면용: 한국어 span 과 영어 span 을 순서대로 만듭니다 */
function t(v, fn) {
  if (v == null) return "";
  const f = fn || (x => esc(x));
  if (isPair(v)) {
    return '<span class="kr">' + f(v.kr == null ? "" : v.kr) + '</span><span class="en">' + f(v.en == null ? "" : v.en) + '</span>';
  }
  return f(v);
}
/* 알림, 탭 이름처럼 span 을 쓸 수 없는 곳: 지금 언어의 글자만 고릅니다 */
function pick(v) {
  if (v == null) return "";
  if (isPair(v)) return String(v[LANG] != null ? v[LANG] : (v.kr || v.en || ""));
  return String(v);
}
function fill(tpl) {
  return String(tpl)
    .replace("{guests}", CONFIG.guests)
    .replace("{bedrooms}", CONFIG.bedrooms)
    .replace("{bathrooms}", CONFIG.bathrooms)
    .replace("{checkin}", CONFIG.checkinTime)
    .replace("{checkout}", CONFIG.checkoutTime);
}
const escFill = x => esc(fill(x));
const escBr = x => esc(x).split("\n").join("<br>");

function setTitle() {
  const sub = pick(CONFIG.nameSub);
  document.title = pick(CONFIG.name) + (sub ? " " + sub : "");
}
function setLang(key) {
  LANG = key;
  document.documentElement.setAttribute("data-lang", key);
  document.documentElement.setAttribute("lang", key === "kr" ? "ko" : "en");
  try { localStorage.setItem(LANG_KEY, key); } catch (e) {}
  document.querySelectorAll("[data-lang-btn]").forEach(b => {
    b.setAttribute("aria-pressed", b.getAttribute("data-lang-btn") === key);
  });
  setTitle();
  updateChecks();
}

function copyText(value, message) {
  const T = CONFIG.text;
  const done = () => showToast(pick(message || T.copied));
  const fallback = () => {
    try {
      const ta = document.createElement("textarea");
      ta.value = value;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      ok ? done() : showToast(pick(T.copyFailed));
    } catch (e) { showToast(pick(T.copyFailed)); }
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(value).then(done).catch(fallback);
  } else {
    fallback();
  }
}

let toastTimer;
function renderReviewSheet() {
  const R = CONFIG.reviewHelper;
  if (!R) return "";
  return '<div class="rv-overlay" id="reviewSheet" hidden>' +
    '<div class="rv-sheet" role="dialog" aria-modal="true">' +
      '<p class="stars" aria-hidden="true">★★★★★</p>' +
      '<p class="rv-from">' + t(R.from) + '</p>' +
      '<p class="rv-title">' + t(R.title) + '</p>' +
      '<p class="rv-body">' + t(R.body) + '</p>' +
      '<p class="rv-ask">' + t(R.ask) + '</p>' +
      '<textarea class="rv-text" id="reviewText" rows="4"></textarea>' +
      '<a class="review-btn" id="reviewGo" href="' + esc(CONFIG.reviewLink || "https://www.airbnb.com/trips") + '" target="_blank" rel="noopener">' + t(R.copyOpen) + ' →</a>' +
      '<button class="rv-later" type="button" data-review-close>' + t(R.later) + '</button>' +
    '</div>' +
  '</div>';
}
function openReviewSheet() {
  const el = document.getElementById("reviewSheet");
  if (!el) {
    if (CONFIG.reviewLink) window.open(CONFIG.reviewLink, "_blank", "noopener");
    return;
  }
  const ta = document.getElementById("reviewText");
  if (ta) ta.placeholder = pick(CONFIG.reviewHelper.placeholder);
  el.hidden = false;
  document.body.classList.add("rv-lock");
}
function closeReviewSheet() {
  const el = document.getElementById("reviewSheet");
  if (el) el.hidden = true;
  document.body.classList.remove("rv-lock");
}
function copyReviewText() {
  const ta = document.getElementById("reviewText");
  const v = ta ? ta.value.trim() : "";
  if (!v) return;
  let ok = false;
  try {
    ta.removeAttribute("readonly");
    ta.select();
    ok = document.execCommand("copy");
    ta.blur();
  } catch (e) {}
  if (!ok && navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(v).catch(() => {});
  }
  showToast(pick(CONFIG.reviewHelper.copied));
}

function showToast(msg) {
  const el = document.getElementById("toast");
  if (!el) return;
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2400);
}

function renderLangBar() {
  return '<div class="langbar" role="group">' +
    (CONFIG.languages || []).map(l =>
      '<button class="lang-btn" type="button" data-lang-btn="' + esc(l.key) + '" aria-pressed="' + (l.key === LANG) + '" lang="' + (l.key === "kr" ? "ko" : "en") + '">' + esc(l.label) + '</button>'
    ).join("") +
  '</div>';
}

/* ---------- 지도 (Leaflet). 못 불러와도 목록은 그대로 보입니다 ---------- */
const LEAFLET_JS = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js";
const LEAFLET_CSS = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css";
let mapState = { tried: false, map: null, markers: [] };

// Inline SVGs keep category markers crisp without an external icon library.
const MAP_ICONS = {
  cafe: '<path d="M4 7h13v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V7Zm13 1h2a3 3 0 0 1 0 6h-2M3 21h16"/>',
  food: '<path d="M4 3v7m3-7v7m3-7v7M4 10h6m-3 0v11M17 3c-3 3-3 8 0 10h2V3h-2Zm2 10v8"/>',
  bar: '<path d="M4 3h16l-2 7a6 6 0 0 1-12 0L4 3Zm8 13v5m-4 0h8M6 9h12"/>',
  see: '<path d="M3 7h4l2-3h6l2 3h4v13H3V7Zm9 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"/>',
  shop: '<path d="m3 9 3 12h12l3-12H3Zm5 0 4-6 4 6M8 13v4m4-4v4m4-4v4"/>'
};
function placeMapIcon(type) {
  const drawing = MAP_ICONS[type] || MAP_ICONS.see;
  return L.divIcon({
    className: "place-map-icon",
    html: '<span class="place-map-symbol"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + drawing + '</svg></span>',
    iconSize: [38, 38], iconAnchor: [19, 19], popupAnchor: [0, -20]
  });
}

function loadLeaflet(done) {
  if (window.L) { done(true); return; }
  try {
    const css = document.createElement("link");
    css.rel = "stylesheet";
    css.href = LEAFLET_CSS;
    document.head.appendChild(css);
    const js = document.createElement("script");
    js.src = LEAFLET_JS;
    let finished = false;
    const finish = ok => { if (!finished) { finished = true; done(ok && !!window.L); } };
    js.onload = () => finish(true);
    js.onerror = () => finish(false);
    setTimeout(() => finish(!!window.L), 8000);
    document.head.appendChild(js);
  } catch (e) { done(false); }
}

function initMap() {
  if (mapState.tried) {
    if (mapState.map) setTimeout(() => mapState.map.invalidateSize(), 50);
    return;
  }
  mapState.tried = true;
  const withCoord = (CONFIG.places || []).map((p, i) => ({ p: p, i: i })).filter(o => hasCoord(o.p));
  if (withCoord.length === 0) return;
  loadLeaflet(function (ok) {
    if (!ok) return;
    try {
      const wrap = document.getElementById("mapWrap");
      wrap.hidden = false;
      const accent = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#1B3D29";
      const map = L.map("map", { scrollWheelZoom: false, attributionControl: true });
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap"
      }).addTo(map);
      const pts = [];
      withCoord.forEach(o => {
        const m = L.marker([o.p.lat, o.p.lng], { icon: placeMapIcon(o.p.type) }).addTo(map);
        m.bindTooltip(t(o.p.name), { direction: "top", offset: [0, -6] });
        m.on("click", () => goToPlace(o.i));
        mapState.markers.push({ marker: m, type: o.p.type });
        pts.push([o.p.lat, o.p.lng]);
      });
      if (typeof CONFIG.homeLat === "number" && typeof CONFIG.homeLng === "number") {
        L.circleMarker([CONFIG.homeLat, CONFIG.homeLng], {
          radius: 11, color: accent, weight: 3, fillColor: "#FFFFFF", fillOpacity: 1
        }).addTo(map).bindTooltip(t(CONFIG.text.homePin), { permanent: true, direction: "right", offset: [10, 0], className: "home-tip" });
        pts.push([CONFIG.homeLat, CONFIG.homeLng]);
      }
      mapState.map = map;
      fitMap(pts);
      if (mapState.filter && mapState.filter !== "all") setFilter(mapState.filter);
    } catch (e) {
      const wrap = document.getElementById("mapWrap");
      if (wrap) wrap.hidden = true;
    }
  });
}

function nearHome(pts) {
  if (typeof CONFIG.homeLat !== "number" || typeof CONFIG.homeLng !== "number") return pts;
  const near = pts.filter(pt => Math.abs(pt[0] - CONFIG.homeLat) < 0.011 && Math.abs(pt[1] - CONFIG.homeLng) < 0.014);
  return near.length >= 2 ? near : pts;
}

function fitMap(pts) {
  const map = mapState.map;
  if (!map || !pts.length) return;
  pts = nearHome(pts);
  if (pts.length === 1) { map.setView(pts[0], 16); return; }
  map.fitBounds(pts, { padding: [24, 24], maxZoom: 16 });
}

function goToPlace(i) {
  const card = document.getElementById("place-" + i);
  if (!card) return;
  if (card.hidden) setFilter("all");
  card.scrollIntoView({ behavior: "smooth", block: "center" });
  card.classList.remove("flash");
  void card.offsetWidth;
  card.classList.add("flash");
}

function setFilter(key) {
  mapState.filter = key;
  document.querySelectorAll("[data-filter]").forEach(b => {
    const on = b.getAttribute("data-filter") === key;
    b.classList.toggle("on", on);
    b.setAttribute("aria-pressed", on);
  });
  let shown = 0;
  document.querySelectorAll("#placeList .place").forEach(c => {
    const show = key === "all" || c.getAttribute("data-type") === key;
    c.hidden = !show;
    if (show) shown++;
  });
  const empty = document.getElementById("placesEmpty");
  if (empty) empty.hidden = shown > 0;
  if (mapState.map) {
    const pts = [];
    mapState.markers.forEach(o => {
      const show = key === "all" || o.type === key;
      if (show) { o.marker.addTo(mapState.map); const ll = o.marker.getLatLng(); pts.push([ll.lat, ll.lng]); }
      else { o.marker.remove(); }
    });
    if (pts.length) fitMap(pts);
  }
}

/* ---------- 대중교통 오시는 길 지도 (체크인 화면) ---------- */
let transitMapState = { tried: false, map: null };
function transitIcon(kind) {
  const bus = '<path d="M4 16V7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v9m-16 0a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2m-16 0h16M7 20v-2m10 2v-2M6 11h12"/><circle cx="8" cy="16" r="1"/><circle cx="16" cy="16" r="1"/>';
  const train = '<path d="M5 3h14v12a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3V3Zm0 9h14M9 21l-2 2m10-2 2 2M9 17h.01M15 17h.01"/>';
  const drawing = kind === "train" ? train : bus;
  const bg = kind === "train" ? "var(--accent)" : "#B8964A";
  return L.divIcon({
    className: "transit-map-icon",
    html: '<span class="transit-map-symbol" style="background:' + bg + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + drawing + '</svg></span>',
    iconSize: [34, 34], iconAnchor: [17, 17], popupAnchor: [0, -18]
  });
}
function initTransitMap() {
  const tr = CONFIG.transit;
  if (!tr || !hasCoord(tr.boardStop) || !hasCoord(tr.alightStop) || !hasCoord(tr.station)) return;
  if (transitMapState.tried) {
    if (transitMapState.map) setTimeout(() => transitMapState.map.invalidateSize(), 50);
    return;
  }
  transitMapState.tried = true;
  loadLeaflet(function (ok) {
    if (!ok) return;
    try {
      const wrap = document.getElementById("transitMapWrap");
      wrap.hidden = false;
      const accent = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#4b4727";
      const map = L.map("transitMap", { scrollWheelZoom: false, attributionControl: true });
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap"
      }).addTo(map);
      const pts = [];
      const busPts = [];
      const hasHome = typeof CONFIG.homeLat === "number" && typeof CONFIG.homeLng === "number";
      if (hasHome) {
        L.circleMarker([CONFIG.homeLat, CONFIG.homeLng], {
          radius: 10, color: accent, weight: 3, fillColor: "#FFFFFF", fillOpacity: 1
        }).addTo(map).bindTooltip(t(CONFIG.text.homePin), { direction: "top", offset: [0, -8] });
        pts.push([CONFIG.homeLat, CONFIG.homeLng]);
        busPts.push([CONFIG.homeLat, CONFIG.homeLng]);
      }
      [["boardStop", "bus"], ["alightStop", "bus"], ["station", "train"]].forEach(([key, kind]) => {
        const p = tr[key];
        const m = L.marker([p.lat, p.lng], { icon: transitIcon(kind) }).addTo(map);
        m.bindTooltip(t(p.name), { direction: "top", offset: [0, -6] });
        pts.push([p.lat, p.lng]);
      });
      busPts.push([tr.boardStop.lat, tr.boardStop.lng], [tr.alightStop.lat, tr.alightStop.lng]);
      L.polyline(busPts, { color: "#B8964A", weight: 4, opacity: 0.9 }).addTo(map);
      L.polyline([[tr.alightStop.lat, tr.alightStop.lng], [tr.station.lat, tr.station.lng]], {
        color: accent, weight: 3, opacity: 0.9, dashArray: "6 8"
      }).addTo(map);
      transitMapState.map = map;
      map.fitBounds(pts, { padding: [24, 24], maxZoom: 16 });
    } catch (e) {
      const wrap = document.getElementById("transitMapWrap");
      if (wrap) wrap.hidden = true;
    }
  });
}

const CHECK_KEY = "guestapp-checkout";
function loadChecks() {
  try { return JSON.parse(localStorage.getItem(CHECK_KEY) || "[]"); } catch (e) { return []; }
}
function saveChecks(arr) {
  try { localStorage.setItem(CHECK_KEY, JSON.stringify(arr)); } catch (e) {}
}
function updateChecks() {
  const boxes = document.querySelectorAll("[data-check]");
  const done = [];
  boxes.forEach(b => { if (b.checked) done.push(Number(b.getAttribute("data-check"))); });
  saveChecks(done);
  const T = CONFIG.text;
  const el = document.getElementById("checkProgress");
  if (!el) return;
  const fillCount = s => String(s).replace("{total}", boxes.length).replace("{done}", done.length);
  el.innerHTML = (done.length === boxes.length && boxes.length > 0)
    ? t(T.checkoutDone)
    : t(T.checkoutProgress, x => esc(fillCount(x)));
}

const CHECKIN_KEY = "guestapp-checkin";
function loadCheckin() {
  try { return JSON.parse(localStorage.getItem(CHECKIN_KEY) || "[]"); } catch (e) { return []; }
}
function saveCheckin() {
  const done = [];
  document.querySelectorAll("[data-checkin]").forEach(b => { if (b.checked) done.push(Number(b.getAttribute("data-checkin"))); });
  try { localStorage.setItem(CHECKIN_KEY, JSON.stringify(done)); } catch (e) {}
}

const SCREENS = ["home", "checkin", "wifi", "house", "nearby", "faq", "checkout", "contact"];

function showScreen(id) {
  if (SCREENS.indexOf(id) === -1) id = "home";
  SCREENS.forEach(s => {
    const el = document.getElementById("screen-" + s);
    if (el) el.hidden = (s !== id);
  });
  window.scrollTo(0, 0);
  if (id === "nearby") {
    if (pendingPreset) { setFilter(pendingPreset); pendingPreset = null; }
    initMap();
  }
  if (id === "checkin") initTransitMap();
}
let pendingPreset = null;
let reviewAsked = false;
function maybeAskReview(changed) {
  if (reviewAsked || !changed.checked) return;
  const tasks = Array.from(document.querySelectorAll("[data-check]")).filter(b => !b.closest(".star"));
  const star = document.querySelector(".star [data-check]");
  if (tasks.length && tasks.every(b => b.checked) && !(star && star.checked)) {
    reviewAsked = true;
    setTimeout(openReviewSheet, 400);
  }
}

function start() {
  setTitle();
  if (CONFIG.accentColor) {
    document.documentElement.style.setProperty("--accent", CONFIG.accentColor);
  }
  if (CONFIG.backgroundColor) {
    document.documentElement.style.setProperty("--page", CONFIG.backgroundColor);
  }
  const app = document.getElementById("app");
  app.innerHTML =
    renderLangBar() +
    '<section id="screen-home">' + renderHome() + '</section>' +
    '<section id="screen-checkin" hidden>' + renderCheckin() + '</section>' +
    '<section id="screen-wifi" hidden>' + renderWifi() + '</section>' +
    '<section id="screen-house" hidden>' + renderHouse() + '</section>' +
    '<section id="screen-nearby" hidden>' + renderNearby() + '</section>' +
    '<section id="screen-faq" hidden>' + renderFaq() + '</section>' +
    '<section id="screen-checkout" hidden>' + renderCheckout() + '</section>' +
    '<section id="screen-contact" hidden>' + renderContact() + '</section>' +
    renderReviewSheet();

  const saved = loadChecks();
  document.querySelectorAll("[data-check]").forEach(b => {
    if (saved.indexOf(Number(b.getAttribute("data-check"))) !== -1) b.checked = true;
  });
  const savedIn = loadCheckin();
  document.querySelectorAll("[data-checkin]").forEach(b => {
    if (savedIn.indexOf(Number(b.getAttribute("data-checkin"))) !== -1) b.checked = true;
  });
  app.addEventListener("change", function (e) {
    if (e.target.matches("[data-check]")) { updateChecks(); maybeAskReview(e.target); }
    if (e.target.matches("[data-checkin]")) saveCheckin();
  });
  updateChecks();

  app.addEventListener("click", function (e) {
    if (e.target.closest("[data-review-open]")) { openReviewSheet(); return; }
    if (e.target.closest("[data-review-close]") || e.target.id === "reviewSheet") { closeReviewSheet(); return; }
    if (e.target.closest("#reviewGo")) { copyReviewText(); setTimeout(closeReviewSheet, 300); return; }
    const lb = e.target.closest("[data-lang-btn]");
    if (lb) { setLang(lb.getAttribute("data-lang-btn")); return; }
    const go = e.target.closest("[data-go]");
    if (go) {
      const id = go.getAttribute("data-go");
      if (id === "nearby") pendingPreset = go.getAttribute("data-preset") || "all";
      if (id === "home") {
        history.replaceState(null, "", location.pathname + location.search);
        showScreen("home");
      } else {
        location.hash = id;
      }
      return;
    }
    const fl = e.target.closest("[data-filter]");
    if (fl) { setFilter(fl.getAttribute("data-filter")); return; }
    const cp = e.target.closest("[data-copy]");
    if (cp) {
      const kind = cp.getAttribute("data-copy");
      if (kind === "address") copyText(CONFIG.address);
      if (kind === "wifi") copyText(CONFIG.wifiPassword);
      if (kind === "kakao") {
        copyText(CONFIG.kakaoId, CONFIG.text.kakaoCopied);
        setTimeout(function () { window.location.href = "kakaotalk://"; }, 1200);
      }
    }
  });

  window.addEventListener("hashchange", function () {
    if (location.hash === "#review") { showScreen("checkout"); openReviewSheet(); return; }
    showScreen(location.hash.replace("#", "") || "home");
  });
  if (location.hash === "#review") { showScreen("checkout"); openReviewSheet(); }
  else showScreen(location.hash.replace("#", "") || "home");
}

document.addEventListener("DOMContentLoaded", start);
</script>

        { kr: "지하철: 공항철도를 타고 김포공항역에서 9호선 급행으로 갈아타 고속터미널역까지 가신 뒤, 7호선으로 한 정거장 가면 내방역입니다. 김포공항에서 오실 때도 9호선 급행 → 고속터미널역 → 7호선 내방역 순서입니다. 내방역에서 숙소까지는 택시로 약 5분, 기본요금 정도(약 4,800원)입니다. 짐이 많으면 고속터미널역에서 바로 택시를 타셔도 됩니다(약 10분, 약 6,000원).", en: "Subway: Take the AREX airport train to Gimpo Airport Station, transfer to the Line 9 express to Express Bus Terminal, then take Line 7 one stop to Naebang Station. From Gimpo Airport, it's the same: Line 9 express → Express Bus Terminal → Line 7 to Naebang. From Naebang Station, a taxi to the house takes about 5 min, around the base fare (about ₩4,800). With lots of luggage, you can also take a taxi straight from Express Bus Terminal (about 10 min, about ₩6,000).", cn: "地铁：乘机场快线到Gimpo Airport站，换乘9号线急行到Express Bus Terminal站，再乘7号线一站到Naebang站。从金浦机场出发也是:9号线急行 → Express Bus Terminal站 → 7号线Naebang站。从Naebang站打车到住所约5分钟，车费大约是起步价(约₩4,800)。行李多的话，也可以在Express Bus Terminal站直接打车(约10分钟，约₩6,000)。" },
        { kr: "택시 요금은 교통 상황에 따라 달라지고, 밤 10시~새벽 4시에는 20~40% 할증이 붙습니다. 버스 시간과 요금도 바뀔 수 있으니 출발 전에 한 번 확인해 주세요.", en: "Taxi fares vary with traffic, and there's a 20–40% surcharge from 10 PM to 4 AM. Bus times and fares can change too, so please double-check before you set off.", cn: "出租车费会随路况变化，晚上10点至凌晨4点加收20~40%。巴士时刻和票价也可能变动，出发前请再确认一下。" }
      ]

/* ---------- 언어 ---------- */
const LANG_KEY = "guestapp-lang";
function langAttr(key) {
  return key === "kr" ? "ko" : key === "cn" ? "zh-CN" : "en";
}
function detectLang() {
  try {
    const saved = localStorage.getItem(LANG_KEY);
    if (saved === "kr" || saved === "en" || saved === "cn") return saved;
  } catch (e) {}
  const nav = (navigator.language || (navigator.languages && navigator.languages[0]) || "").toLowerCase();
  if (nav.indexOf("ko") === 0) return "kr";
  if (nav.indexOf("zh") === 0) return "cn";
  return "en";
}
let LANG = detectLang();
document.documentElement.setAttribute("data-lang", LANG);
document.documentElement.setAttribute("lang", langAttr(LANG));

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function isPair(v) {
  return v && typeof v === "object" && ("kr" in v || "en" in v || "cn" in v);
}
/* 화면용: 한국어 span, 영어 span, 중국어 span 을 순서대로 만듭니다 */
function t(v, fn) {
  if (v == null) return "";
  const f = fn || (x => esc(x));
  if (isPair(v)) {
    return '<span class="kr">' + f(v.kr == null ? "" : v.kr) + '</span><span class="en">' + f(v.en == null ? "" : v.en) + '</span><span class="cn">' + f(v.cn == null ? "" : v.cn) + '</span>';
  }
  return f(v);
}
/* 알림, 탭 이름처럼 span 을 쓸 수 없는 곳: 지금 언어의 글자만 고릅니다 */
function pick(v) {
  if (v == null) return "";
  if (isPair(v)) return String(v[LANG] != null ? v[LANG] : (v.kr || v.en || v.cn || ""));
  return String(v);
}
function fill(tpl) {
  return String(tpl)
    .replace("{guests}", CONFIG.guests)
    .replace("{bedrooms}", CONFIG.bedrooms)
    .replace("{bathrooms}", CONFIG.bathrooms)
    .replace("{checkin}", CONFIG.checkinTime)
    .replace("{checkout}", CONFIG.checkoutTime);
}
const escFill = x => esc(fill(x));
const escBr = x => esc(x).split("\n").join("<br>");

function setTitle() {
  const sub = pick(CONFIG.nameSub);
  document.title = pick(CONFIG.name) + (sub ? " " + sub : "");
}
function setLang(key) {
  LANG = key;
  document.documentElement.setAttribute("data-lang", key);
  document.documentElement.setAttribute("lang", langAttr(key));
  try { localStorage.setItem(LANG_KEY, key); } catch (e) {}
  document.querySelectorAll("[data-lang-btn]").forEach(b => {
    b.setAttribute("aria-pressed", b.getAttribute("data-lang-btn") === key);
  });
  setTitle();
  updateChecks();
}

function copyText(value, message) {
  const T = CONFIG.text;
  const done = () => showToast(pick(message || T.copied));
  const fallback = () => {
    try {
      const ta = document.createElement("textarea");
      ta.value = value;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      ok ? done() : showToast(pick(T.copyFailed));
    } catch (e) { showToast(pick(T.copyFailed)); }
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(value).then(done).catch(fallback);
  } else {
    fallback();
  }
}

let toastTimer;
function renderReviewSheet() {
  const R = CONFIG.reviewHelper;
  if (!R) return "";
  return '<div class="rv-overlay" id="reviewSheet" hidden>' +
    '<div class="rv-sheet" role="dialog" aria-modal="true">' +
      '<p class="stars" aria-hidden="true">★★★★★</p>' +
      '<p class="rv-from">' + t(R.from) + '</p>' +
      '<p class="rv-title">' + t(R.title) + '</p>' +
      '<p class="rv-body">' + t(R.body) + '</p>' +
      '<p class="rv-ask">' + t(R.ask) + '</p>' +
      '<textarea class="rv-text" id="reviewText" rows="4"></textarea>' +
      '<a class="review-btn" id="reviewGo" href="' + esc(CONFIG.reviewLink || "https://www.airbnb.com/trips") + '" target="_blank" rel="noopener">' + t(R.copyOpen) + ' →</a>' +
      '<button class="rv-later" type="button" data-review-close>' + t(R.later) + '</button>' +
    '</div>' +
  '</div>';
}
function openReviewSheet() {
  const el = document.getElementById("reviewSheet");
  if (!el) {
    if (CONFIG.reviewLink) window.open(CONFIG.reviewLink, "_blank", "noopener");
    return;
  }
  const ta = document.getElementById("reviewText");
  if (ta) ta.placeholder = pick(CONFIG.reviewHelper.placeholder);
  el.hidden = false;
  document.body.classList.add("rv-lock");
}
function closeReviewSheet() {
  const el = document.getElementById("reviewSheet");
  if (el) el.hidden = true;
  document.body.classList.remove("rv-lock");
}
function copyReviewText() {
  const ta = document.getElementById("reviewText");
  const v = ta ? ta.value.trim() : "";
  if (!v) return;
  let ok = false;
  try {
    ta.removeAttribute("readonly");
    ta.select();
    ok = document.execCommand("copy");
    ta.blur();
  } catch (e) {}
  if (!ok && navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(v).catch(() => {});
  }
  showToast(pick(CONFIG.reviewHelper.copied));
}

function showToast(msg) {
  const el = document.getElementById("toast");
  if (!el) return;
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2400);
}

function renderLangBar() {
  return '<div class="langbar" role="group">' +
    (CONFIG.languages || []).map(l =>
      '<button class="lang-btn" type="button" data-lang-btn="' + esc(l.key) + '" aria-pressed="' + (l.key === LANG) + '" lang="' + langAttr(l.key) + '">' + esc(l.label) + '</button>'
    ).join("") +
  '</div>';
}

function backButton() {
  return '<button class="back" type="button" data-go="home">' + t(CONFIG.text.back) + '</button>';
}

function placeMapIcon(type) {
  const drawing = MAP_ICONS[type] || MAP_ICONS.see;
  return L.divIcon({
    className: "place-map-icon",
    html: '<span class="place-map-symbol"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + drawing + '</svg></span>',
    iconSize: [38, 38], iconAnchor: [19, 19], popupAnchor: [0, -20]
  });
}

function loadScript(src, done) {
  try {
    const js = document.createElement("script");
    js.src = src;
    let finished = false;
    const finish = ok => { if (!finished) { finished = true; done(ok); } };
    js.onload = () => finish(true);
    js.onerror = () => finish(false);
    setTimeout(() => finish(false), 10000);
    document.head.appendChild(js);
  } catch (e) { done(false); }
}
let mapLibreState = null;
function mapLibreLayer() {
  return (window.MaplibreGLLeaflet && window.MaplibreGLLeaflet.maplibreGL) || (window.L && L.maplibreGL) || null;
}
function loadMapLibre(done) {
  if (window.maplibregl && mapLibreLayer()) { done(true); return; }
  if (mapLibreState) { mapLibreState.push(done); return; }
  mapLibreState = [done];
  const finish = ok => { const q = mapLibreState; mapLibreState = ok ? null : []; q.forEach(f => f(ok)); };
  try {
    const css = document.createElement("link");
    css.rel = "stylesheet";
    css.href = MAPLIBRE_CSS;
    document.head.appendChild(css);
  } catch (e) {}
  loadScript(MAPLIBRE_JS, function (ok) {
    if (!ok || !window.maplibregl) { finish(false); return; }
    loadScript(MAPLIBRE_LEAFLET_JS, function (ok2) { finish(ok2 && !!mapLibreLayer()); });
  });
}
function addBaseMap(map) {
  const osm = L.tileLayer(MAP_TILES, { maxZoom: 19, className: "osm-soft", attribution: "&copy; OpenStreetMap" }).addTo(map);
  loadMapLibre(function (ok) {
    if (!ok) return;
    try {
      const gl = mapLibreLayer()({ style: MAP_STYLE });
      gl.addTo(map);
      const glMap = gl.getMaplibreMap();
      glMap.once("load", function () {
        map.removeLayer(osm);
        map.attributionControl.addAttribution('<a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> &copy; OpenMapTiles &copy; OpenStreetMap');
      });
    } catch (e) {}
  });
}

function loadLeaflet(done) {
  if (window.L) { done(true); return; }
  try {
    const css = document.createElement("link");
    css.rel = "stylesheet";
    css.href = LEAFLET_CSS;
    document.head.appendChild(css);
    const js = document.createElement("script");
    js.src = LEAFLET_JS;
    let finished = false;
    const finish = ok => { if (!finished) { finished = true; done(ok && !!window.L); } };
    js.onload = () => finish(true);
    js.onerror = () => finish(false);
    setTimeout(() => finish(!!window.L), 8000);
    document.head.appendChild(js);
  } catch (e) { done(false); }
}

function initMap() {
  if (mapState.tried) {
    if (mapState.map) setTimeout(() => mapState.map.invalidateSize(), 50);
    return;
  }
  mapState.tried = true;
  const withCoord = (CONFIG.places || []).map((p, i) => ({ p: p, i: i })).filter(o => hasCoord(o.p));
  if (withCoord.length === 0) return;
  loadLeaflet(function (ok) {
    if (!ok) return;
    try {
      const wrap = document.getElementById("mapWrap");
      wrap.hidden = false;
      const accent = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#1B3D29";
      const map = L.map("map", { scrollWheelZoom: false, attributionControl: true });
      addBaseMap(map);
      const pts = [];
      const startKey = mapState.filter || defaultFilter();
      withCoord.forEach(o => {
        const m = L.marker([o.p.lat, o.p.lng], { icon: placeMapIcon(o.p.type) });
        if (o.p.type === startKey) m.addTo(map);
        m.bindTooltip(t(o.p.name), { direction: "top", offset: [0, -6] });
        m.on("click", () => goToPlace(o.i));
        mapState.markers.push({ marker: m, type: o.p.type });
        if (o.p.type === startKey) pts.push([o.p.lat, o.p.lng]);
      });
      if (typeof CONFIG.homeLat === "number" && typeof CONFIG.homeLng === "number") {
        L.marker([CONFIG.homeLat, CONFIG.homeLng], { icon: homeMapIcon(), zIndexOffset: 1000 })
          .addTo(map).bindTooltip(t(CONFIG.text.homePin), { permanent: true, direction: "right", offset: [18, 0], className: "home-tip" });
        pts.push([CONFIG.homeLat, CONFIG.homeLng]);
      }
      mapState.map = map;
      fitMap(pts);
    } catch (e) {
      const wrap = document.getElementById("mapWrap");
      if (wrap) wrap.hidden = true;
    }
  });
}

function nearHome(pts) {
  if (typeof CONFIG.homeLat !== "number" || typeof CONFIG.homeLng !== "number") return pts;
  const near = pts.filter(pt => Math.abs(pt[0] - CONFIG.homeLat) < 0.011 && Math.abs(pt[1] - CONFIG.homeLng) < 0.014);
  return near.length >= 2 ? near : pts;
}

function fitMap(pts) {
  const map = mapState.map;
  if (!map || !pts.length) return;
  pts = nearHome(pts);
  if (pts.length === 1) { map.setView(pts[0], 16); return; }
  map.fitBounds(pts, { padding: [24, 24], maxZoom: 16 });
}

function goToPlace(i) {
  const card = document.getElementById("place-" + i);
  if (!card) return;
  if (card.hidden) setFilter(card.getAttribute("data-type"));
  card.scrollIntoView({ behavior: "smooth", block: "center" });
  card.classList.remove("flash");
  void card.offsetWidth;
  card.classList.add("flash");
}

function defaultFilter() {
  return ((CONFIG.placeTypes || [])[0] || {}).key || "food";
}
function setFilter(key) {
  mapState.filter = key;
  document.querySelectorAll("[data-filter]").forEach(b => {
    const on = b.getAttribute("data-filter") === key;
    b.classList.toggle("on", on);
    b.setAttribute("aria-pressed", on);
  });
  let shown = 0;
  document.querySelectorAll("#placeList .place").forEach(c => {
    const show = c.getAttribute("data-type") === key;
    c.hidden = !show;
    if (show) shown++;
  });
  const empty = document.getElementById("placesEmpty");
  if (empty) empty.hidden = shown > 0;
  if (mapState.map) {
    const pts = [];
    mapState.markers.forEach(o => {
      const show = o.type === key;
      if (show) { o.marker.addTo(mapState.map); const ll = o.marker.getLatLng(); pts.push([ll.lat, ll.lng]); }
      else { o.marker.remove(); }
    });
    if (typeof CONFIG.homeLat === "number") pts.push([CONFIG.homeLat, CONFIG.homeLng]);
    if (pts.length) fitMap(pts);
  }
}

/* ---------- 대중교통 오시는 길 지도 (유용한 정보 화면) ---------- */
let transitMapState = { tried: false, map: null };
function transitIcon(kind) {
  const bus = '<path d="M4 16V7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v9m-16 0a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2m-16 0h16M7 20v-2m10 2v-2M6 11h12"/><circle cx="8" cy="16" r="1"/><circle cx="16" cy="16" r="1"/>';
  const train = '<path d="M5 3h14v12a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3V3Zm0 9h14M9 21l-2 2m10-2 2 2M9 17h.01M15 17h.01"/>';
  const drawing = kind === "train" ? train : bus;
  const bg = kind === "train" ? "var(--accent)" : "#B8964A";
  return L.divIcon({
    className: "transit-map-icon",
    html: '<span class="transit-map-symbol" style="background:' + bg + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + drawing + '</svg></span>',
    iconSize: [34, 34], iconAnchor: [17, 17], popupAnchor: [0, -18]
  });
}
function initTransitMap() {
  const tr = CONFIG.transit;
  if (!tr || !hasCoord(tr.boardStop) || !hasCoord(tr.alightStop) || !hasCoord(tr.station)) return;
  if (transitMapState.tried) {
    if (transitMapState.map) setTimeout(() => transitMapState.map.invalidateSize(), 50);
    return;
  }
  transitMapState.tried = true;
  loadLeaflet(function (ok) {
    if (!ok) return;
    try {
      const wrap = document.getElementById("transitMapWrap");
      wrap.hidden = false;
      const accent = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#4b4727";
      const map = L.map("transitMap", { scrollWheelZoom: false, attributionControl: true });
      addBaseMap(map);
      const pts = [];
      const busPts = [];
      const hasHome = typeof CONFIG.homeLat === "number" && typeof CONFIG.homeLng === "number";
      if (hasHome) {
        L.circleMarker([CONFIG.homeLat, CONFIG.homeLng], {
          radius: 10, color: accent, weight: 3, fillColor: "#FFFFFF", fillOpacity: 1
        }).addTo(map).bindTooltip(t(CONFIG.text.homePin), { direction: "top", offset: [0, -8] });
        pts.push([CONFIG.homeLat, CONFIG.homeLng]);
        busPts.push([CONFIG.homeLat, CONFIG.homeLng]);
      }
      [["boardStop", "bus"], ["alightStop", "bus"], ["station", "train"]].forEach(([key, kind]) => {
        const p = tr[key];
        const m = L.marker([p.lat, p.lng], { icon: transitIcon(kind) }).addTo(map);
        m.bindTooltip(t(p.name), { direction: "top", offset: [0, -6] });
        pts.push([p.lat, p.lng]);
      });
      busPts.push([tr.boardStop.lat, tr.boardStop.lng], [tr.alightStop.lat, tr.alightStop.lng]);
      L.polyline(busPts, { color: "#B8964A", weight: 4, opacity: 0.9 }).addTo(map);
      L.polyline([[tr.alightStop.lat, tr.alightStop.lng], [tr.station.lat, tr.station.lng]], {
        color: accent, weight: 3, opacity: 0.9, dashArray: "6 8"
      }).addTo(map);
      transitMapState.map = map;
      map.fitBounds(pts, { padding: [24, 24], maxZoom: 16 });
    } catch (e) {
      const wrap = document.getElementById("transitMapWrap");
      if (wrap) wrap.hidden = true;
    }
  });
}

/* ---------- 체크아웃 확인 목록 ---------- */
const CHECK_KEY = "guestapp-checkout";
function loadChecks() {
  try { return JSON.parse(localStorage.getItem(CHECK_KEY) || "[]"); } catch (e) { return []; }
}
function saveChecks(arr) {
  try { localStorage.setItem(CHECK_KEY, JSON.stringify(arr)); } catch (e) {}
}
function updateChecks() {
  const boxes = document.querySelectorAll("[data-check]");
  const done = [];
  boxes.forEach(b => { if (b.checked) done.push(Number(b.getAttribute("data-check"))); });
  saveChecks(done);
  const T = CONFIG.text;
  const el = document.getElementById("checkProgress");
  if (!el) return;
  const fillCount = s => String(s).replace("{total}", boxes.length).replace("{done}", done.length);
  el.innerHTML = (done.length === boxes.length && boxes.length > 0)
    ? t(T.checkoutDone)
    : t(T.checkoutProgress, x => esc(fillCount(x)));
}

const CHECKIN_KEY = "guestapp-checkin";
function loadCheckin() {
  try { return JSON.parse(localStorage.getItem(CHECKIN_KEY) || "[]"); } catch (e) { return []; }
}
function saveCheckin() {
  const done = [];
  document.querySelectorAll("[data-checkin]").forEach(b => { if (b.checked) done.push(Number(b.getAttribute("data-checkin"))); });
  try { localStorage.setItem(CHECKIN_KEY, JSON.stringify(done)); } catch (e) {}
}

const SCREENS = ["home", "checkin", "wifi", "house", "nearby", "faq", "checkout", "contact", "parking"];

function showScreen(id) {
  if (SCREENS.indexOf(id) === -1) id = "home";
  SCREENS.forEach(s => {
    const el = document.getElementById("screen-" + s);
    if (el) el.hidden = (s !== id);
  });
  window.scrollTo(0, 0);
  if (id === "nearby") {
    setFilter(pendingPreset || mapState.filter || defaultFilter()); pendingPreset = null;
    initMap();
  }
}
let pendingPreset = null;
let reviewAsked = false;
function maybeAskReview(changed) {
  if (reviewAsked || !changed.checked) return;
  const tasks = Array.from(document.querySelectorAll("[data-check]")).filter(b => !b.closest(".star"));
  const star = document.querySelector(".star [data-check]");
  if (tasks.length && tasks.every(b => b.checked) && !(star && star.checked)) {
    reviewAsked = true;
    setTimeout(openReviewSheet, 400);
  }
}

function start() {
  setTitle();
  if (CONFIG.accentColor) {
    document.documentElement.style.setProperty("--accent", CONFIG.accentColor);
  }
  if (CONFIG.backgroundColor) {
    document.documentElement.style.setProperty("--page", CONFIG.backgroundColor);
  }
  const app = document.getElementById("app");
  app.innerHTML =
    renderLangBar() +
    '<section id="screen-home">' + renderHome() + '</section>' +
    '<section id="screen-checkin" hidden>' + renderCheckin() + '</section>' +
    '<section id="screen-wifi" hidden>' + renderWifi() + '</section>' +
    '<section id="screen-house" hidden>' + renderHouse() + '</section>' +
    '<section id="screen-nearby" hidden>' + renderNearby() + '</section>' +
    '<section id="screen-faq" hidden>' + renderFaq() + '</section>' +
    '<section id="screen-checkout" hidden>' + renderCheckout() + '</section>' +
    '<section id="screen-contact" hidden>' + renderContact() + '</section>' +
    '<section id="screen-parking" hidden>' + renderParking() + '</section>' +
    renderReviewSheet();

  const saved = loadChecks();
  document.querySelectorAll("[data-check]").forEach(b => {
    if (saved.indexOf(Number(b.getAttribute("data-check"))) !== -1) b.checked = true;
  });
  const savedIn = loadCheckin();
  document.querySelectorAll("[data-checkin]").forEach(b => {
    if (savedIn.indexOf(Number(b.getAttribute("data-checkin"))) !== -1) b.checked = true;
  });
  const transitAcc = document.getElementById("transitFaqAcc");
  if (transitAcc) transitAcc.addEventListener("toggle", function () { if (transitAcc.open) initTransitMap(); });
  app.addEventListener("change", function (e) {
    if (e.target.matches("[data-check]")) { updateChecks(); maybeAskReview(e.target); }
    if (e.target.matches("[data-checkin]")) saveCheckin();
  });
  updateChecks();

  app.addEventListener("click", function (e) {
    if (e.target.closest("[data-review-open]")) { openReviewSheet(); return; }
    if (e.target.closest("[data-review-close]") || e.target.id === "reviewSheet") { closeReviewSheet(); return; }
    if (e.target.closest("#reviewGo")) { copyReviewText(); setTimeout(closeReviewSheet, 300); return; }
    const lb = e.target.closest("[data-lang-btn]");
    if (lb) { setLang(lb.getAttribute("data-lang-btn")); return; }
    const go = e.target.closest("[data-go]");
    if (go) {
      const id = go.getAttribute("data-go");
      if (id === "nearby") pendingPreset = go.getAttribute("data-preset") || defaultFilter();
      if (go.hasAttribute("data-open-fac")) setTimeout(openIntercom, 60);
      if (id === "home") {
        history.replaceState(null, "", location.pathname + location.search);
        showScreen("home");
      } else {
        location.hash = id;
      }
      return;
    }
    if (e.target.closest("[data-car-card]")) { openCarCard(); return; }
    const fl = e.target.closest("[data-filter]");
    if (fl) { setFilter(fl.getAttribute("data-filter")); return; }
    const cp = e.target.closest("[data-copy]");
    if (cp) {
      const kind = cp.getAttribute("data-copy");
      if (kind === "address") copyText(CONFIG.address);
      if (kind === "wifi") copyText(CONFIG.wifiPassword);
      if (kind === "food") copyText(CONFIG.address + (CONFIG.addressEn ? " / " + CONFIG.addressEn : ""), CONFIG.text.foodCopied);
      if (kind === "kakao") {
        copyText(CONFIG.kakaoId, CONFIG.text.kakaoCopied);
        setTimeout(function () { window.location.href = "kakaotalk://"; }, 1200);
      }
    }
  });

  window.addEventListener("hashchange", function () {
    if (location.hash === "#review") { showScreen("checkout"); openReviewSheet(); return; }
    showScreen(location.hash.replace("#", "") || "home");
  });
  if (location.hash === "#review") { showScreen("checkout"); openReviewSheet(); }
  else showScreen(location.hash.replace("#", "") || "home");
}

/* ---------- 오늘 날씨 (Open-Meteo, 무료·키 없음). 못 불러오면 칸이 아예 안 보입니다 ---------- */
const WEATHER_TEXT = {
  sun:   { icon: "☀️", label: { kr: "맑음", en: "Clear", cn: "晴" } },
  part:  { icon: "⛅", label: { kr: "구름 조금", en: "Partly cloudy", cn: "多云" } },
  cloud: { icon: "☁️", label: { kr: "흐림", en: "Cloudy", cn: "阴" } },
  fog:   { icon: "🌫️", label: { kr: "안개", en: "Foggy", cn: "雾" } },
  rain:  { icon: "🌧️", label: { kr: "비", en: "Rain", cn: "雨" } },
  snow:  { icon: "🌨️", label: { kr: "눈", en: "Snow", cn: "雪" } },
  storm: { icon: "⛈️", label: { kr: "뇌우", en: "Thunderstorm", cn: "雷阵雨" } }
};
function weatherKind(code) {
  if (code === 0) return "sun";
  if (code === 1 || code === 2) return "part";
  if (code === 3) return "cloud";
  if (code === 45 || code === 48) return "fog";
  if ((code >= 71 && code <= 77) || code === 85 || code === 86) return "snow";
  if (code >= 95) return "storm";
  return "rain";
}
function loadWeather() {
  const box = document.getElementById("homeWeather");
  if (!box || !window.fetch || typeof CONFIG.homeLat !== "number") return;
  const url = "https://api.open-meteo.com/v1/forecast?latitude=" + CONFIG.homeLat + "&longitude=" + CONFIG.homeLng +
    "&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=Asia%2FSeoul&forecast_days=1";
  fetch(url).then(r => r.json()).then(function (d) {
    const now = Math.round(d.current.temperature_2m);
    const hi = Math.round(d.daily.temperature_2m_max[0]);
    const lo = Math.round(d.daily.temperature_2m_min[0]);
    const w = WEATHER_TEXT[weatherKind(d.current.weather_code)];
    if (!isFinite(now) || !w) return;
    box.innerHTML = '<span class="w-ico" aria-hidden="true">' + w.icon + '</span>' +
      '<span class="w-now">' + now + '°</span>' +
      '<span class="w-label">' + t(w.label) + '</span>' +
      '<span class="w-range">↑' + hi + '° ↓' + lo + '°</span>';
    box.title = pick({ kr: "서래마을 오늘 날씨", en: "Today's weather in Seorae Village", cn: "Seorae Village 今日天气" });
    box.hidden = false;
  }).catch(function () {});
}

/* ---------- 홈 화면에 저장하기 ---------- */
let installPrompt = null;
window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); installPrompt = e; });
function isStandalone() {
  return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true;
}
function setupInstall() {
  const box = document.getElementById("installBox");
  if (!box || isStandalone()) return;
  box.hidden = false;
  document.addEventListener("click", function (e) {
    if (!e.target.closest("[data-install]")) return;
    if (installPrompt) {
      installPrompt.prompt();
      installPrompt.userChoice.then(function (r) { if (r && r.outcome === "accepted") box.hidden = true; installPrompt = null; });
      return;
    }
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    const help = document.getElementById("installHelp");
    help.innerHTML = t(ios ? CONFIG.text.installIos : CONFIG.text.installAndroid);
    help.hidden = !help.hidden;
  });
}

document.addEventListener("DOMContentLoaded", start);
document.addEventListener("DOMContentLoaded", setupInstall);
document.addEventListener("DOMContentLoaded", loadWeather);

<style id="background-unification-final">
/* Background unification only — no image files or content changed. */
:root{--bg:#f4efe5!important;--paper:#f4efe5!important;}
html,body,#app,.site,.site-header,.hero,.hero-copy,.content,.welcome,.explore,footer,
#screen-home,#screen-checkin,#screen-wifi,#screen-house,#screen-nearby,#screen-faq,#screen-checkout,#screen-contact{background:#f4efe5!important;}
.hero{background:#f4efe5!important;}
.hero-image:before{background:linear-gradient(90deg,#f4efe5 0%,rgba(244,239,229,.45) 12%,transparent 28%)!important;}
.card,.acc,.chip,.back,.utility{background:#f4efe5!important;}
.feature-shade{background:linear-gradient(90deg,rgba(244,239,229,.97) 0%,rgba(244,239,229,.78) 42%,rgba(244,239,229,.08) 78%)!important;}
.caution{background:rgba(59,56,34,.035)!important;}
.brand-button,.brand-button img{background:transparent!important;}
.brand-button img{mix-blend-mode:normal!important;}
@media(max-width:680px){.hero-image:before{background:linear-gradient(180deg,#f4efe5 0%,rgba(244,239,229,.20) 18%,transparent 35%)!important;}}

/* 첫 화면에서는 위쪽 언어 단추를 숨기고, 로고 옆 단추만 보입니다 */
#app > .langbar:has(+ #screen-home:not([hidden])) { display: none; }

/* 첫 화면 체크인 / 체크아웃 시각 */
.stay-times{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 24px}
.stay-times button{min-height:48px;padding:18px 16px;border:1px solid var(--line);border-radius:16px;background:#faf7f0;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;color:var(--ink)}
.stay-times small{font:500 13px var(--sans);letter-spacing:.16em;color:var(--muted)}
.stay-times strong{font:400 36px/1.1 var(--serif);color:var(--accent)}
.stay-times span{font:16px var(--sans);color:#625a4d}

/* 체크박스 목록을 눈에 띄게 */
.card.todo{border:1.5px solid var(--accent);background:#fbf8f2}
.todo-title{margin:0 0 12px;font:500 20px var(--serif);color:var(--accent)}
.checks{margin:0;display:flex;flex-direction:column;gap:10px}
.checks .check{align-items:center;gap:14px;min-height:56px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;font-size:16px;line-height:1.5}
.checks .check input{appearance:none;-webkit-appearance:none;flex:0 0 28px;width:28px;height:28px;margin:0;border:2px solid var(--accent);border-radius:8px;background:#fff;cursor:pointer;display:grid;place-content:center}
.checks .check input:checked{background:var(--accent)}
.checks .check input:checked::after{content:"";width:8px;height:14px;border:solid #fff;border-width:0 3px 3px 0;transform:translateY(-2px) rotate(45deg)}
.checks .check:has(input:checked){background:#eef1ea;border-color:var(--accent)}
.checks .check:has(input:checked) span{color:var(--muted)}
.todo #checkProgress{margin:12px 0 0}

/* 후기 부탁 항목 (star: true) */
.checks .check.star{flex-direction:row;align-items:flex-start;padding:22px 18px;background:var(--accent);border-color:var(--accent);box-shadow:0 8px 22px rgba(27,61,41,.22)}

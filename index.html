   ============================================================ */

/* ---------- 언어 ---------- */
const LANG_KEY = "guestapp-lang";
function detectLang() {
  try {
    const saved = localStorage.getItem(LANG_KEY);
    if (saved === "kr" || saved === "en") return saved;
  } catch (e) {}
  const nav = (navigator.language || (navigator.languages && navigator.languages[0]) || "").toLowerCase();
  return nav.indexOf("ko") === 0 ? "kr" : "en";
}
let LANG = detectLang();
document.documentElement.setAttribute("data-lang", LANG);
document.documentElement.setAttribute("lang", LANG === "kr" ? "ko" : "en");

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function isPair(v) {
  return v && typeof v === "object" && ("kr" in v || "en" in v);
}
/* 화면용: 한국어 span 과 영어 span 을 순서대로 만듭니다 */
function t(v, fn) {
  if (v == null) return "";
  const f = fn || (x => esc(x));
  if (isPair(v)) {
    return '<span class="kr">' + f(v.kr == null ? "" : v.kr) + '</span><span class="en">' + f(v.en == null ? "" : v.en) + '</span>';
  }
  return f(v);
}
/* 알림, 탭 이름처럼 span 을 쓸 수 없는 곳: 지금 언어의 글자만 고릅니다 */
function pick(v) {
  if (v == null) return "";
  if (isPair(v)) return String(v[LANG] != null ? v[LANG] : (v.kr || v.en || ""));
  return String(v);
}
function fill(tpl) {
  return String(tpl)
    .replace("{guests}", CONFIG.guests)
    .replace("{bedrooms}", CONFIG.bedrooms)
    .replace("{bathrooms}", CONFIG.bathrooms)
    .replace("{checkin}", CONFIG.checkinTime)
    .replace("{checkout}", CONFIG.checkoutTime);
}
const escFill = x => esc(fill(x));
const escBr = x => esc(x).split("\n").join("<br>");

function setTitle() {
  const sub = pick(CONFIG.nameSub);
  document.title = pick(CONFIG.name) + (sub ? " " + sub : "");
}
function setLang(key) {
  LANG = key;
  document.documentElement.setAttribute("data-lang", key);
  document.documentElement.setAttribute("lang", key === "kr" ? "ko" : "en");
  try { localStorage.setItem(LANG_KEY, key); } catch (e) {}
  document.querySelectorAll("[data-lang-btn]").forEach(b => {
    b.setAttribute("aria-pressed", b.getAttribute("data-lang-btn") === key);
  });
  setTitle();
  updateChecks();
}

function copyText(value, message) {
  const T = CONFIG.text;
  const done = () => showToast(pick(message || T.copied));
  const fallback = () => {
    try {
      const ta = document.createElement("textarea");
      ta.value = value;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      ok ? done() : showToast(pick(T.copyFailed));
    } catch (e) { showToast(pick(T.copyFailed)); }
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(value).then(done).catch(fallback);
  } else {
    fallback();
  }
}

let toastTimer;
function showToast(msg) {
  const el = document.getElementById("toast");
  if (!el) return;
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2400);
}

function renderLangBar() {
  return '<div class="langbar" role="group">' +
    (CONFIG.languages || []).map(l =>
      '<button class="lang-btn" type="button" data-lang-btn="' + esc(l.key) + '" aria-pressed="' + (l.key === LANG) + '" lang="' + (l.key === "kr" ? "ko" : "en") + '">' + esc(l.label) + '</button>'
    ).join("") +
  '</div>';
}

function backButton() {
  return '<button class="back" type="button" data-go="home">' + t(CONFIG.text.back) + '</button>';
}

  const items = [

    ["house", T.menuHouse, T.menuHouseSub],
    ["nearby", T.menuNearby, T.menuNearbySub],
    ["faq", T.menuFaq, T.menuFaqSub],
    ["checkout", T.menuCheckout, T.menuCheckoutSub],

  ];
  return '<div class="brand">' + t(CONFIG.name) + ' <span class="name-sub">' + t(CONFIG.nameSub) + '</span></div>' +

    '<header class="hero">' +
      '<h1>' + t(CONFIG.welcome, escBr) + '</h1>' +
      '<p class="tagline">' + t(CONFIG.tagline) + '</p>' +
      '<p class="meta">' + t(T.roomsLine, escFill) + '<br>' + t(T.timeLine, escFill) + '</p>' +
    '</header>' +
    '<div class="menu">' +
      items.map(i =>
        '<button class="menu-btn" type="button" data-go="' + i[0] + '">' +
          '<span class="menu-title">' + t(i[1]) + '</span>' +
          '<span class="menu-sub">' + t(i[2]) + '</span>' +
        '</button>'
      ).join("") +
    '</div>';

  return backButton() +

        '<a class="btn" href="https://map.naver.com/p/search/' + q + '" target="_blank" rel="noopener">' + t(T.openNaver) + '</a>' +
        '<a class="btn" href="https://map.kakao.com/link/search/' + q + '" target="_blank" rel="noopener">' + t(T.openKakaoMap) + '</a>' +

      '</div>' +
    '</div>' +
    '<div class="card two">' +
      '<div><p class="label">' + t(T.checkinLabel) + '</p><p class="big">' + esc(CONFIG.checkinTime) + '</p></div>' +
      '<div><p class="label">' + t(T.checkoutLabel) + '</p><p class="big">' + esc(CONFIG.checkoutTime) + '</p></div>' +

/* ---------- 지도 (Leaflet). 못 불러와도 목록은 그대로 보입니다 ---------- */
const LEAFLET_JS = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js";
const LEAFLET_CSS = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css";
let mapState = { tried: false, map: null, markers: [] };

function loadLeaflet(done) {
  if (window.L) { done(true); return; }
  try {
    const css = document.createElement("link");
    css.rel = "stylesheet";
    css.href = LEAFLET_CSS;
    document.head.appendChild(css);
    const js = document.createElement("script");
    js.src = LEAFLET_JS;
    let finished = false;
    const finish = ok => { if (!finished) { finished = true; done(ok && !!window.L); } };
    js.onload = () => finish(true);
    js.onerror = () => finish(false);
    setTimeout(() => finish(!!window.L), 8000);
    document.head.appendChild(js);
  } catch (e) { done(false); }
}

function initMap() {
  if (mapState.tried) {
    if (mapState.map) setTimeout(() => mapState.map.invalidateSize(), 50);
    return;
  }
  mapState.tried = true;
  const withCoord = (CONFIG.places || []).map((p, i) => ({ p: p, i: i })).filter(o => hasCoord(o.p));
  if (withCoord.length === 0) return;
  loadLeaflet(function (ok) {
    if (!ok) return;
    try {
      const wrap = document.getElementById("mapWrap");
      wrap.hidden = false;
      const accent = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#1B3D29";
      const map = L.map("map", { scrollWheelZoom: false, attributionControl: true });
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap"
      }).addTo(map);
      const pts = [];
      withCoord.forEach(o => {
        const m = L.circleMarker([o.p.lat, o.p.lng], {
          radius: 8, color: "#FFFFFF", weight: 2, fillColor: accent, fillOpacity: 1
        }).addTo(map);
        m.bindTooltip(t(o.p.name), { direction: "top", offset: [0, -6] });
        m.on("click", () => goToPlace(o.i));
        mapState.markers.push({ marker: m, type: o.p.type });
        pts.push([o.p.lat, o.p.lng]);
      });
      if (typeof CONFIG.homeLat === "number" && typeof CONFIG.homeLng === "number") {
        L.circleMarker([CONFIG.homeLat, CONFIG.homeLng], {
          radius: 11, color: accent, weight: 3, fillColor: "#FFFFFF", fillOpacity: 1
        }).addTo(map).bindTooltip(t(CONFIG.text.homePin), { permanent: true, direction: "right", offset: [10, 0], className: "home-tip" });
        pts.push([CONFIG.homeLat, CONFIG.homeLng]);
      }
      mapState.map = map;
      fitMap(pts);
    } catch (e) {
      const wrap = document.getElementById("mapWrap");
      if (wrap) wrap.hidden = true;
    }
  });
}

function nearHome(pts) {
  if (typeof CONFIG.homeLat !== "number" || typeof CONFIG.homeLng !== "number") return pts;
  const near = pts.filter(pt => Math.abs(pt[0] - CONFIG.homeLat) < 0.011 && Math.abs(pt[1] - CONFIG.homeLng) < 0.014);
  return near.length >= 2 ? near : pts;
}

function fitMap(pts) {
  const map = mapState.map;
  if (!map || !pts.length) return;
  pts = nearHome(pts);
  if (pts.length === 1) { map.setView(pts[0], 16); return; }
  map.fitBounds(pts, { padding: [24, 24], maxZoom: 16 });
}

function goToPlace(i) {
  const card = document.getElementById("place-" + i);
  if (!card) return;
  if (card.hidden) setFilter("all");
  card.scrollIntoView({ behavior: "smooth", block: "center" });
  card.classList.remove("flash");
  void card.offsetWidth;
  card.classList.add("flash");
}

function setFilter(key) {
  document.querySelectorAll("[data-filter]").forEach(b => {
    const on = b.getAttribute("data-filter") === key;
    b.classList.toggle("on", on);
    b.setAttribute("aria-pressed", on);
  });
  let shown = 0;
  document.querySelectorAll("#placeList .place").forEach(c => {
    const show = key === "all" || c.getAttribute("data-type") === key;
    c.hidden = !show;
    if (show) shown++;
  });
  const empty = document.getElementById("placesEmpty");
  if (empty) empty.hidden = shown > 0;
  if (mapState.map) {
    const pts = [];
    mapState.markers.forEach(o => {
      const show = key === "all" || o.type === key;
      if (show) { o.marker.addTo(mapState.map); const ll = o.marker.getLatLng(); pts.push([ll.lat, ll.lng]); }
      else { o.marker.remove(); }
    });
    if (pts.length) fitMap(pts);
  }
}

/* ---------- 체크아웃 확인 목록 ---------- */
const CHECK_KEY = "guestapp-checkout";
function loadChecks() {
  try { return JSON.parse(localStorage.getItem(CHECK_KEY) || "[]"); } catch (e) { return []; }
}
function saveChecks(arr) {
  try { localStorage.setItem(CHECK_KEY, JSON.stringify(arr)); } catch (e) {}
}
function updateChecks() {
  const boxes = document.querySelectorAll("[data-check]");
  const done = [];
  boxes.forEach(b => { if (b.checked) done.push(Number(b.getAttribute("data-check"))); });
  saveChecks(done);
  const T = CONFIG.text;
  const el = document.getElementById("checkProgress");
  if (!el) return;
  const fillCount = s => String(s).replace("{total}", boxes.length).replace("{done}", done.length);
  el.innerHTML = (done.length === boxes.length && boxes.length > 0)
    ? t(T.checkoutDone)
    : t(T.checkoutProgress, x => esc(fillCount(x)));
}

const SCREENS = ["home", "checkin", "wifi", "house", "nearby", "faq", "checkout", "contact"];

function showScreen(id) {
  if (SCREENS.indexOf(id) === -1) id = "home";
  SCREENS.forEach(s => {
    const el = document.getElementById("screen-" + s);
    if (el) el.hidden = (s !== id);
  });
  window.scrollTo(0, 0);
  if (id === "nearby") initMap();
}

function start() {
  setTitle();
  if (CONFIG.accentColor) {
    document.documentElement.style.setProperty("--accent", CONFIG.accentColor);
  }
  if (CONFIG.backgroundColor) {
    document.documentElement.style.setProperty("--page", CONFIG.backgroundColor);
  }
  const app = document.getElementById("app");
  app.innerHTML =
    renderLangBar() +
    '<section id="screen-home">' + renderHome() + '</section>' +
    '<section id="screen-checkin" hidden>' + renderCheckin() + '</section>' +
    '<section id="screen-wifi" hidden>' + renderWifi() + '</section>' +
    '<section id="screen-house" hidden>' + renderHouse() + '</section>' +
    '<section id="screen-nearby" hidden>' + renderNearby() + '</section>' +
    '<section id="screen-faq" hidden>' + renderFaq() + '</section>' +
    '<section id="screen-checkout" hidden>' + renderCheckout() + '</section>' +
    '<section id="screen-contact" hidden>' + renderContact() + '</section>';

  const saved = loadChecks();
  document.querySelectorAll("[data-check]").forEach(b => {
    if (saved.indexOf(Number(b.getAttribute("data-check"))) !== -1) b.checked = true;
  });
  app.addEventListener("change", function (e) {
    if (e.target.matches("[data-check]")) updateChecks();
  });
  updateChecks();

  app.addEventListener("click", function (e) {
    const lb = e.target.closest("[data-lang-btn]");
    if (lb) { setLang(lb.getAttribute("data-lang-btn")); return; }
    const go = e.target.closest("[data-go]");
    if (go) {
      const id = go.getAttribute("data-go");
      if (id === "home") {
        history.replaceState(null, "", location.pathname + location.search);
        showScreen("home");
      } else {
        location.hash = id;
      }
      return;
    }
    const fl = e.target.closest("[data-filter]");
    if (fl) { setFilter(fl.getAttribute("data-filter")); return; }
    const cp = e.target.closest("[data-copy]");
    if (cp) {
      const kind = cp.getAttribute("data-copy");
      if (kind === "address") copyText(CONFIG.address);
      if (kind === "wifi") copyText(CONFIG.wifiPassword);
      if (kind === "kakao") {
        copyText(CONFIG.kakaoId, CONFIG.text.kakaoCopied);
        setTimeout(function () { window.location.href = "kakaotalk://"; }, 1200);
      }
    }
  });

  window.addEventListener("hashchange", function () {
    showScreen(location.hash.replace("#", "") || "home");
  });
  showScreen(location.hash.replace("#", "") || "home");
}

document.addEventListener("DOMContentLoaded", start);
</script>

.acc summary::-webkit-details-marker { display: none; }
.acc-head { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.acc-title { font-family: var(--serif); font-weight: 700; font-size: 18px; color: var(--accent); }
.acc-sub { font-size: 16px; color: var(--muted); }
.acc-mark { position: relative; width: 16px; height: 16px; flex-shrink: 0; }
.acc-mark::before, .acc-mark::after {
  content: "";
  position: absolute;
  left: 0; top: 7px;
  width: 16px; height: 2px;
  border-radius: 2px;
  background: var(--accent);
  transition: transform 0.2s;
}
.acc-mark::after { transform: rotate(90deg); }
.acc[open] .acc-mark::after { transform: rotate(0deg); }
.acc-body { padding: 0 18px 18px; }
.acc-body .label { margin-top: 4px; }
.caution {
  margin: 14px 0 0;
  padding: 12px 14px;
  border-radius: 8px;
  background: var(--page);
}
.caution .line { margin: 0; }

.pic {
  display: block;
  width: 100%;
  max-width: 100%;
  height: auto;
  margin-top: 14px;
  border-radius: 8px;
}

.rules { margin: 0; padding-left: 22px; }
.rules li { margin: 0 0 10px; font-size: 16px; }
.rules li:last-child { margin-bottom: 0; }

.step-title {
  margin: 0 0 10px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--serif);
  font-weight: 700;
  font-size: 18px;
  color: var(--accent);
}
.step-no {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 1px solid var(--accent);
  font-family: var(--sans);
  font-size: 16px;
  font-weight: 600;
  flex-shrink: 0;
}

.checks { list-style: none; margin: 8px 0 0; padding: 0; }
.check {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  min-height: 48px;
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
  font-size: 16px;
  cursor: pointer;
}
.check input {
  appearance: none;
  -webkit-appearance: none;
  width: 24px;
  height: 24px;
  margin: 0;
  flex-shrink: 0;
  border: 2px solid var(--accent);
  border-radius: 6px;
  background: var(--card);
  display: grid;
  place-items: center;
  cursor: pointer;
}
.check input:checked { background: var(--accent); }
.check input:checked::after {
  content: "";
  width: 6px;
  height: 11px;
  border: solid #FFFFFF;
  border-width: 0 2px 2px 0;
  transform: rotate(45deg) translate(-1px, -1px);
}
.check input:checked + span { color: var(--muted); text-decoration: line-through; }

.review { background: var(--accent); border-color: var(--accent); }
.review .value { color: #FFFFFF; }

.map-wrap {
  margin: 0 0 14px;
  border: 1px solid var(--line);
  border-radius: 14px;
  overflow: hidden;
  background: var(--card);
  box-shadow: var(--shadow);
}
.map-wrap[hidden] { display: none; }
#map { width: 100%; height: 260px; }
.home-tip { font-family: var(--sans); font-weight: 600; font-size: 13px; }

.chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 2px 0 14px;
  -webkit-overflow-scrolling: touch;
}
.chip {
  flex-shrink: 0;
  min-height: 48px;
  padding: 0 18px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--card);
  font: inherit;
  font-size: 16px;
  color: var(--ink);
  cursor: pointer;
}
.chip.on { background: var(--accent); border-color: var(--accent); color: #FFFFFF; }

.place[hidden] { display: none; }
.place-type { margin: 0 0 2px; font-size: 16px; color: var(--muted); }
.place-name { margin: 0 0 6px; font-family: var(--serif); font-weight: 700; font-size: 20px; color: var(--accent); }
.place-line { margin: 0 0 10px; font-size: 16px; }
.place-meta { margin: 0 0 2px; font-size: 16px; color: var(--muted); }
.place.flash { animation: flash 1.4s ease-out; }
@keyframes flash {
  0% { box-shadow: 0 0 0 3px var(--accent); }
  100% { box-shadow: var(--shadow); }
}
@media (prefers-reduced-motion: reduce) {
  .place.flash { animation: none; outline: 3px solid var(--accent); }
}

#toast {
  position: fixed;
  left: 50%;
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  width: calc(100% - 40px);
  max-width: 480px;
  padding: 14px 18px;
  border-radius: 8px;
  background: #222222;
  color: #FFFFFF;
  font-size: 16px;
  text-align: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
}
#toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
</body>
